        ],

        cart: { items: [], discount: 0 }
    };

    let db = DEFAULT_STATE;
    let syncState = 'synced'; // 'synced' | 'syncing' | 'offline'

    // --- GESTIÓN DE SINCRONIZACIÓN EN LA NUBE ---
    async function loadCloudDB() {
        updateSyncIndicator('syncing');
        try {
            const response = await fetch(CLOUD_CONFIG.endpoint, {
                headers: { 'Authorization': `Bearer ${CLOUD_CONFIG.apiKey}` }
            });
            if (!response.ok) throw new Error('Error al conectar con la nube');
            const cloudData = await response.json();
            if (cloudData && cloudData.payload) {
                db = cloudData.payload;
            } else {
                db = DEFAULT_STATE;
                await saveDBToCloud();
            }
            updateSyncIndicator('synced');
        } catch (err) {
            console.warn("Modo sin conexión o error de red:", err);
            // Respaldo de contingencia estrictamente offline si la red falla
            const localFallback = localStorage.getItem('boss_system_db_offline_fallback');
            if (localFallback) {
                db = JSON.parse(localFallback);
            }
            updateSyncIndicator('offline', 'No fue posible sincronizar los datos. Verifica tu conexión a Internet.');
        }
        if (typeof initApp === 'function') initApp();
    }

    async function saveDB() {
        // Guardar respaldo local de emergencia para evitar pérdida ante caída repentina de red
        localStorage.setItem('boss_system_db_offline_fallback', JSON.stringify(db));
        await saveDBToCloud();
    }

    async function saveDBToCloud() {
        updateSyncIndicator('syncing');
        try {
            const response = await fetch(CLOUD_CONFIG.endpoint, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${CLOUD_CONFIG.apiKey}`
                },
                body: JSON.stringify({ payload: db, updated_at: new Date().toISOString() })
            });
            if (!response.ok) throw new Error('Fallo al guardar en la nube');
            updateSyncIndicator('synced');
        } catch (err) {
            console.error("Error al sincronizar con la nube:", err);
            updateSyncIndicator('offline', 'No fue posible sincronizar los datos. Verifica tu conexión a Internet.');
        }
    }

    function updateSyncIndicator(status, message = '') {
        syncState = status;
        const indicator = document.getElementById('sync-indicator');
        if (!indicator) return;
        if (status === 'synced') {
            indicator.innerHTML = '<span class="flex items-center space-x-1 text-xs text-emerald-600 font-medium" title="Datos sincronizados en la nube"><span>🟢</span><span class="hidden sm:inline">Sincronizado</span></span>';
        } else if (status === 'syncing') {
            indicator.innerHTML = '<span class="flex items-center space-x-1 text-xs text-amber-600 font-medium animate-pulse" title="Sincronizando con la nube..."><span>🟠</span><span class="hidden sm:inline">Sincronizando...</span></span>';
        } else {
            indicator.innerHTML = '<span class="flex items-center space-x-1 text-xs text-rose-600 font-medium" title="Sin conexión / No sincronizado"><span>🔴</span><span class="hidden sm:inline">Sin conexión</span></span>';
            if (message) showToast(message, 'error');
        }
    }
</script>

<script>
    // --- UTILS & NOTIFICATIONS ---
    function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `p-4 rounded-xl shadow-lg text-white text-sm font-medium transform transition-all duration-300 translate-y-2 opacity-0 pointer-events-auto flex items-center space-x-2 ${type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-blue-600'}`;
        toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-info'} text-lg"></i><span>${message}</span>`;
        container.appendChild(toast);
        setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
        setTimeout(() => {
            toast.classList.add('translate-y-2', 'opacity-0');
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    function formatMoney(amount) {
        return '$' + Number(amount || 0).toFixed(2);
    }

    // --- CLOCK & DATE ---
    function updateClock() {
        const now = new Date();
        const dateStr = now.toLocaleDateString('es-MX', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        const timeStr = now.toLocaleTimeString('es-MX');
        const dateEl = document.getElementById('current-date');
        const timeEl = document.getElementById('current-time');
        if (dateEl) dateEl.innerText = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
        if (timeEl) timeEl.innerText = timeStr;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- LOCK SCREEN LOGIC ---
    function toggleLockScreen() {
        db.auth.isLocked = true;
        saveDB();
        applyLockState();
    }

    function applyLockState() {
        const headerEl = document.getElementById('general-header');
        const sidebarEl = document.getElementById('app-sidebar');
        const mobileNavEl = document.getElementById('mobile-nav');
        const lockOverlay = document.getElementById('lock-screen-overlay');

        if (db.auth.isLocked) {
            if (headerEl) headerEl.classList.add('hidden');
            if (sidebarEl) sidebarEl.classList.add('hidden');
            if (mobileNavEl) mobileNavEl.classList.add('hidden');
            if (lockOverlay) lockOverlay.classList.remove('hidden');
            setTimeout(() => {
                const passInput = document.getElementById('unlock-pass');
                if (passInput) passInput.focus();
            }, 100);
        } else {
            if (headerEl) headerEl.classList.remove('hidden');
            if (sidebarEl && db.auth.currentUser) sidebarEl.classList.remove('hidden');
            if (mobileNavEl && db.auth.currentUser) mobileNavEl.classList.remove('hidden');
            if (lockOverlay) lockOverlay.classList.add('hidden');
        }
    }

    function handleUnlock(e) {
        e.preventDefault();
        const pin = document.getElementById('unlock-pass').value.trim();
        if (pin === '123' || pin === 'admin123' || pin === 'boss123') {
            db.auth.isLocked = false;
            saveDB();
            applyLockState();
            document.getElementById('unlock-pass').value = '';
            showToast('Sistema desbloqueado');
            renderContent();
        } else {
            showToast('Contraseña incorrecta', 'error');
        }
    }

    // --- NAVIGATION & MODULES ---
    let currentModule = 'login';

    function initApp() {
        updateHeaderInfo();
        applyLockState();
        if (!db.auth.currentUser) {
            renderLoginView();
        } else {
            navigateTo(db.auth.currentUser.role === 'admin' ? 'dashboard' : 'pos_snacks');
        }
    }

    function updateHeaderInfo() {
        const businessNameEl = document.getElementById('header-business-name');
        const logoBoxEl = document.getElementById('header-logo-box');
        const roleBadgeEl = document.getElementById('header-role-badge');
        const sessionUserNameEl = document.getElementById('session-user-name');
        const logoutBtnEl = document.getElementById('logout-btn');
        const loginTriggerBtn = document.getElementById('login-trigger-btn');

        if (businessNameEl) businessNameEl.innerText = db.business.name;
        if (logoBoxEl) {
            if (db.business.logo) {
                logoBoxEl.innerHTML = `<img src="${db.business.logo}" class="w-full h-full object-cover" alt="Logo">`;
            } else {
                logoBoxEl.innerHTML = db.business.name.substring(0, 2).toUpperCase();
            }
        }

        if (db.auth.currentUser) {
            if (roleBadgeEl) roleBadgeEl.innerText = db.auth.currentUser.role === 'admin' ? 'Administrador' : 'Vendedor';
            if (sessionUserNameEl) sessionUserNameEl.innerText = db.auth.currentUser.username;
            if (logoutBtnEl) logoutBtnEl.classList.remove('hidden');
            if (loginTriggerBtn) loginTriggerBtn.classList.add('hidden');
        } else {
            if (roleBadgeEl) roleBadgeEl.innerText = 'Sin sesión';
            if (sessionUserNameEl) sessionUserNameEl.innerText = 'Inicie sesión';
            if (logoutBtnEl) logoutBtnEl.classList.add('hidden');
            if (loginTriggerBtn) loginTriggerBtn.classList.remove('hidden');
        }
    }

    function navigateTo(moduleName) {
        if (!db.auth.currentUser) {
            openLoginModal();
            return;
        }
        const role = db.auth.currentUser.role;
        const vendorAllowed = ['pos_snacks', 'pos_services', 'pos_candy', 'finances', 'history'];
        if (role === 'vendedor' && !vendorAllowed.includes(moduleName)) {
            showToast('Acceso restringido para el rol de Vendedor', 'error');
            return;
        }

        currentModule = moduleName;
        renderSidebar();
        renderMobileNav();
        renderContent();
    }

    function renderSidebar() {
        const navContainer = document.getElementById('sidebar-nav-links');
        if (!navContainer) return;
        const role = db.auth.currentUser ? db.auth.currentUser.role : null;
        if (!role) {
            navContainer.innerHTML = '';
            return;
        }

        let links = [];
        if (role === 'admin') {
            links = [
                { id: 'dashboard', label: 'Dashboard', icon: 'fa-chart-pie' },
                { id: 'inventory', label: 'Inventario', icon: 'fa-boxes-stacked' },
                { id: 'pos_snacks', label: 'Aguas y Snacks', icon: 'fa-bottle-water' },
                { id: 'pos_services', label: 'Impresiones y Serv.', icon: 'fa-print' },
                { id: 'pos_candy', label: 'Dulcería / POS', icon: 'fa-candy-cane' },
                { id: 'finances', label: 'Gastos e Ingresos', icon: 'fa-wallet' },
                { id: 'history', label: 'Historial / Tickets', icon: 'fa-clock-rotate-left' },
                { id: 'admin_config', label: 'Administración', icon: 'fa-gears' }
            ];
        } else {
            links = [
                { id: 'pos_snacks', label: 'Aguas y Snacks', icon: 'fa-bottle-water' },
                { id: 'pos_services', label: 'Impresiones y Serv.', icon: 'fa-print' },
                { id: 'pos_candy', label: 'Dulcería / POS', icon: 'fa-candy-cane' },
                { id: 'finances', label: 'Gastos e Ingresos', icon: 'fa-wallet' },
                { id: 'history', label: 'Historial / Tickets', icon: 'fa-clock-rotate-left' }
            ];
        }

        navContainer.innerHTML = links.map(l => `
            <button onclick="navigateTo('${l.id}')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm transition ${currentModule === l.id ? 'bg-boss-50 text-boss-600 font-semibold shadow-sm' : 'text-gray-600 hover:bg-gray-100'}">
                <i class="fa-solid ${l.icon} w-5 text-center text-lg"></i>
                <span>${l.label}</span>
            </button>
        `).join('');
    }

    function renderMobileNav() {
        const mobileNav = document.getElementById('mobile-nav');
        if (!mobileNav) return;
        const role = db.auth.currentUser ? db.auth.currentUser.role : null;
        if (!role) {
            mobileNav.innerHTML = '';
            return;
        }

        let links = role === 'admin' ? [
            { id: 'dashboard', icon: 'fa-chart-pie' },
            { id: 'inventory', icon: 'fa-boxes-stacked' },
            { id: 'pos_snacks', icon: 'fa-bottle-water' },
            { id: 'pos_candy', icon: 'fa-candy-cane' },
            { id: 'finances', icon: 'fa-wallet' },
            { id: 'history', icon: 'fa-clock-rotate-left' }
        ] : [
            { id: 'pos_snacks', icon: 'fa-bottle-water' },
            { id: 'pos_services', icon: 'fa-print' },
            { id: 'pos_candy', icon: 'fa-candy-cane' },
            { id: 'finances', icon: 'fa-wallet' },
            { id: 'history', icon: 'fa-clock-rotate-left' }
        ];

        mobileNav.innerHTML = links.map(l => `
            <button onclick="navigateTo('${l.id}')" class="p-3 rounded-xl flex items-center justify-center touch-target ${currentModule === l.id ? 'bg-boss-50 text-boss-600' : 'text-gray-500 hover:bg-gray-100'}">
                <i class="fa-solid ${l.icon} text-xl"></i>
            </button>
        `).join('');
    }

    // --- RENDER CONTENT DISPATCHER ---
    function renderContent() {
        const area = document.getElementById('main-content-area');
        if (!area) return;
        area.innerHTML = '';
        switch (currentModule) {
            case 'login': renderLoginView(area); break;
            case 'dashboard': renderDashboard(area); break;
            case 'inventory': renderInventory(area); break;
            case 'pos_snacks': renderPOS('Aguas y Snacks', area); break;
            case 'pos_services': renderPOS('Impresiones y Copias', area); break;
            case 'pos_candy': renderPOS('Dulcería', area); break;
            case 'finances': renderFinances(area); break;
            case 'history': renderHistory(area); break;
            case 'admin_config': renderAdminConfig(area); break;
            default: area.innerHTML = `<div class="p-6 text-center text-gray-500">Módulo no encontrado</div>`;
        }
    }

    // --- AUTHENTICATION & LOGIN ---
    function renderLoginView(container = null) {
        const html = `
            <div class="max-w-md mx-auto my-auto bg-white p-8 rounded-3xl shadow-xl border border-gray-100 text-center">
                <div class="w-16 h-16 bg-boss-50 text-boss-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl font-bold">
                    <i class="fa-solid fa-cash-register"></i>

                <h2 class="text-2xl font-bold text-gray-900 mb-1">Bienvenido</h2>

    function handleAdminLogin(e) {
        e.preventDefault();
        const u = document.getElementById('admin-user').value.trim();
        const p = document.getElementById('admin-pass').value.trim();
        if ((u === 'admin' && p === 'admin123') || (u === 'Boss' && p === 'boss123') || (u === 'admin' && p === '123')) {
            db.auth.currentUser = { username: u, role: 'admin' };
            saveDB();
            closeModal();
            updateHeaderInfo();
            applyLockState();
            navigateTo('dashboard');
            showToast('Acceso administrativo concedido');
        } else {
            showToast('Credenciales de administrador incorrectas', 'error');
        }
    }

    function logout() {
        db.auth.currentUser = null;
        saveDB();
        updateHeaderInfo();
        applyLockState();
        renderSidebar();
        renderMobileNav();
        currentModule = 'login';
        renderLoginView(document.getElementById('main-content-area'));
        showToast('Sesión cerrada correctamente');

    // --- MODAL SYSTEM ---
    function openModal(htmlContent) {
        const backdrop = document.getElementById('modal-backdrop');
        const box = document.getElementById('modal-box');
        if (!backdrop || !box) return;
        box.innerHTML = htmlContent + `<button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 text-xl w-10 h-10 flex items-center justify-center rounded-full bg-gray-100 touch-target"><i class="fa-solid fa-xmark"></i></button>`;
        backdrop.classList.remove('hidden');
    }

    function closeModal() {
        const backdrop = document.getElementById('modal-backdrop');
        if (backdrop) backdrop.classList.add('hidden');
    }

    // --- DASHBOARD MODULE ---
    function renderDashboard(container) {
        const todayStr = new Date().toISOString().split('T')[0];
        const sales = db.sales || [];
        const finances = db.finances || [];

        let todaySales = 0, weekSales = 0, monthSales = 0;
        let todayExpenses = 0, monthExpenses = 0;
        let areaStats = { Aguas: 0, Impresiones: 0, Copias: 0, Total: 0 };

        const now = new Date();
        sales.forEach(s => {
            if (s.cancelled) return;
            const sDate = new Date(s.timestamp);
            const sDateStr = s.timestamp.split('T')[0];
            const amount = s.total;

            if (sDateStr === todayStr) {
                todaySales += amount;
                s.items.forEach(i => {
                    if (i.category === 'Aguas y Snacks') areaStats.Aguas += i.quantity;
                    if (i.subcategory === 'Impresiones') areaStats.Impresiones += i.quantity;
                    if (i.subcategory === 'Copias') areaStats.Copias += i.quantity;
                    areaStats.Total += i.quantity;
                });
            }
            if ((now - sDate) / (1000 * 60 * 60 * 24) <= 7) weekSales += amount;
            if (sDate.getMonth() === now.getMonth() && sDate.getFullYear() === now.getFullYear()) monthSales += amount;
        });

        finances.forEach(f => {
            const fDateStr = f.date;
            const fDate = new Date(f.date);
            if (f.type === 'gasto') {
                if (fDateStr === todayStr) todayExpenses += f.amount;
                if (fDate.getMonth() === now.getMonth() && fDate.getFullYear() === now.getFullYear()) monthExpenses += f.amount;
            }
        });

        let cashInRegister = 0;
        finances.forEach(f => {
            if (f.method === 'Efectivo') {
                if (f.type === 'venta' || f.type === 'ingreso') cashInRegister += f.amount;
                if (f.type === 'gasto') cashInRegister -= f.amount;
            }
        });
        sales.forEach(s => {
            if (!s.cancelled && s.paymentMethod === 'Efectivo') cashInRegister += s.total;
        });

        const lowStockItems = db.inventory.filter(i => i.type === 'physical' && i.stock > 0 && i.stock <= i.minStock);
        const outStockItems = db.inventory.filter(i => i.type === 'physical' && i.stock <= 0);

        container.innerHTML = `
            <div class="flex flex-col space-y-6">
                <div class="flex items-center justify-between">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-900">Dashboard General</h2>
                        <p class="text-xs text-gray-500">Resumen y métricas financieras sincronizadas en la nube</p>
                    </div>
                    <button onclick="renderContent()" class="bg-white hover:bg-gray-50 text-gray-700 px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-medium shadow-sm transition flex items-center space-x-2 touch-target">
                        <i class="fa-solid fa-rotate text-boss-600"></i>
                        <span>Actualizar</span>
                    </button>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-semibold text-gray-500 uppercase">Ventas del Día</span>
                            <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg"><i class="fa-solid fa-peso-sign"></i></div>
                        </div>
                        <div class="text-2xl font-bold text-gray-900">${formatMoney(todaySales)}</div>
                        <span class="text-xs text-emerald-600 font-medium mt-1 inline-block">Gastos hoy: ${formatMoney(todayExpenses)}</span>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-semibold text-gray-500 uppercase">Ventas de la Semana</span>
                            <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-lg"><i class="fa-solid fa-chart-line"></i></div>
                        </div>
                        <div class="text-2xl font-bold text-gray-900">${formatMoney(weekSales)}</div>
                        <span class="text-xs text-blue-600 font-medium mt-1 inline-block">Últimos 7 días</span>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-semibold text-gray-500 uppercase">Ventas del Mes</span>
                            <div class="w-10 h-10 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center text-lg"><i class="fa-solid fa-calendar-days"></i></div>
                        </div>
                        <div class="text-2xl font-bold text-gray-900">${formatMoney(monthSales)}</div>
                        <span class="text-xs text-rose-600 font-medium mt-1 inline-block">Gastos mes: ${formatMoney(monthExpenses)}</span>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-semibold text-gray-500 uppercase">Dinero en Caja</span>
                            <div class="w-10 h-10 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-lg"><i class="fa-solid fa-vault"></i></div>
                        </div>
                        <div class="text-2xl font-bold text-gray-900">${formatMoney(cashInRegister)}</div>
                        <span class="text-xs text-gray-500 font-medium mt-1 inline-block">Efectivo actual estimado</span>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 lg:col-span-2">
                        <h3 class="text-lg font-bold text-gray-900 mb-4">Unidades Vendidas por Área (Hoy)</h3>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                            <div class="bg-gray-50 p-4 rounded-xl border border-gray-100 text-center">
                                <span class="text-xs text-gray-500 block mb-1 font-medium">Aguas</span>
                                <span class="text-xl font-bold text-gray-900">${areaStats.Aguas}</span>
                            </div>
                            <div class="bg-gray-50 p-4 rounded-xl border border-gray-100 text-center">
                                <span class="text-xs text-gray-500 block mb-1 font-medium">Impresiones</span>
                                <span class="text-xl font-bold text-gray-900">${areaStats.Impresiones}</span>
                            </div>
                            <div class="bg-gray-50 p-4 rounded-xl border border-gray-100 text-center">
                                <span class="text-xs text-gray-500 block mb-1 font-medium">Copias</span>
                                <span class="text-xl font-bold text-gray-900">${areaStats.Copias}</span>
                            </div>
                            <div class="bg-gray-50 p-4 rounded-xl border border-gray-100 text-center">
                                <span class="text-xs text-boss-600 block mb-1 font-bold">Total</span>
                                <span class="text-xl font-bold text-boss-600">${areaStats.Total}</span>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between">
                        <div>
                            <h3 class="text-lg font-bold text-gray-900 mb-3">Alertas de Inventario</h3>
                            <div class="space-y-2 mb-4">
                                <div class="flex items-center justify-between p-3 rounded-xl bg-rose-50 text-rose-700 text-sm font-medium">
                                    <span>Productos Agotados</span>
                                    <span class="font-bold bg-rose-200 px-2 py-0.5 rounded-full text-xs">${outStockItems.length}</span>
                                </div>
                                <div class="flex items-center justify-between p-3 rounded-xl bg-amber-50 text-amber-700 text-sm font-medium">
                                    <span>Stock Bajo</span>
                                    <span class="font-bold bg-amber-200 px-2 py-0.5 rounded-full text-xs">${lowStockItems.length}</span>
                                </div>
                            </div>
                        </div>
                        <button onclick="navigateTo('inventory')" class="w-full bg-gray-900 hover:bg-gray-800 text-white font-semibold py-2.5 rounded-xl transition text-sm touch-target">
                            Administrar Inventario
                        </button>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <h3 class="text-lg font-bold text-gray-900 mb-4">Ventas Recientes</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">

                                <tr class="border-b border-gray-100 text-xs font-semibold text-gray-500 uppercase">

                                    <th class="py-3 px-4">Hora</th>
                                    <th class="py-3 px-4">Cliente</th>
                                    <th class="py-3 px-4">Método</th>
                                    <th class="py-3 px-4">Total</th>
                                    <th class="py-3 px-4 text-right">Acciones</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100 text-sm">
                                ${sales.slice(-5).reverse().map(s => `
                                    <tr class="hover:bg-gray-50 ${s.cancelled ? 'opacity-50 line-through' : ''}">
                                        <td class="py-3 px-4 font-bold text-gray-900">#${s.id}</td>
                                        <td class="py-3 px-4 text-gray-500">${s.time}</td>
                                        <td class="py-3 px-4">${s.clientName || 'General'}</td>
                                        <td class="py-3 px-4"><span class="px-2.5 py-1 rounded-full text-xs font-medium bg-gray-100">${s.paymentMethod}</span></td>
                                        <td class="py-3 px-4 font-bold text-emerald-600">${formatMoney(s.total)}</td>
                                        <td class="py-3 px-4 text-right">
                                            <button onclick="reprintTicketModal('${s.id}')" class="text-boss-600 hover:text-boss-700 font-medium text-xs bg-boss-50 px-3 py-1.5 rounded-lg touch-target">Imprimir</button>
                                        </td>
                                    </tr>
                                `).join('')}
                                ${sales.length === 0 ? '<tr><td colspan="6" class="text-center py-6 text-gray-400">No hay ventas registradas</td></tr>' : ''}
                            </tbody>

            </div>
        `;
    }

    // --- INVENTORY MODULE ---
    function renderInventory(container) {

        container.innerHTML = `
            <div class="flex flex-col space-y-6">
                <div class="flex flex-wrap items-center justify-between gap-4">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-900">Inventario y Servicios</h2>

                            <span>Nuevo Producto / Servicio</span>

                        <button onclick="exportInventoryBackup()" class="bg-white hover:bg-gray-50 text-gray-700 px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-medium shadow-sm transition flex items-center space-x-2 touch-target">

                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse" id="inventory-table">
                            <thead>
                                <tr class="bg-gray-50 border-b border-gray-200 text-xs font-semibold text-gray-500 uppercase">
                                    <th class="py-3 px-4">ID</th>
                                    <th class="py-3 px-4">Nombre</th>
                                    <th class="py-3 px-4">Categoría / Subcat</th>
                                    <th class="py-3 px-4">Costo</th>
                                    <th class="py-3 px-4">Precio</th>
                                    <th class="py-3 px-4">Utilidad / Margen</th>
                                    <th class="py-3 px-4">Stock</th>
                                    <th class="py-3 px-4 text-right">Acciones</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100 text-sm">
                                ${inventory.map(item => {
                                    const profit = item.price - item.cost;
                                    const margin = item.price > 0 ? ((profit / item.price) * 100).toFixed(1) + '%' : '0%';
                                    let stockBadge = item.type === 'service' ? '<span class="text-gray-400 italic text-xs">Servicio (N/A)</span>' : 
                                        item.stock <= 0 ? '<span class="px-2 py-1 bg-rose-100 text-rose-700 rounded-lg text-xs font-bold">Agotado</span>' :
                                        item.stock <= item.minStock ? `<span class="px-2 py-1 bg-amber-100 text-amber-700 rounded-lg text-xs font-bold">Bajo (${item.stock})</span>` :
                                        `<span class="font-bold text-gray-800">${item.stock}</span>`;
                                    
                                    return `
                                        <tr class="hover:bg-gray-50 transition">
                                            <td class="py-3 px-4 font-mono font-semibold text-xs text-gray-600">${item.id}</td>
                                            <td class="py-3 px-4 font-medium text-gray-900">${item.name}<br><span class="text-xs text-gray-400 font-normal">${item.brand}</span></td>
                                            <td class="py-3 px-4 text-xs text-gray-600">${item.category}<br><span class="text-gray-400">${item.subcategory}</span></td>
                                            <td class="py-3 px-4">${formatMoney(item.cost)}</td>

                                            <td class="py-3 px-4">${stockBadge}</td>

                                                <button onclick="deleteProduct('${item.id}')" class="text-rose-600 hover:text-rose-700 bg-rose-50 px-2.5 py-1.5 rounded-lg text-xs font-medium touch-target">Eliminar</button>

                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        `;

    function filterInventoryTable() {
        const query = document.getElementById('inventory-search').value.toLowerCase();
        const rows = document.querySelectorAll('#inventory-table tbody tr');
        rows.forEach(row => {
            const text = row.innerText.toLowerCase();
            row.style.display = text.includes(query) ? '' : 'none';
        });
    }

        const container = document.getElementById('stock-fields-container');
        if (container) container.style.display = type === 'service' ? 'none' : 'grid';
    }

    function saveProduct(e, existingId) {
        e.preventDefault();
        const id = document.getElementById('p-id').value.trim();
        const type = document.getElementById('p-type').value;
        const name = document.getElementById('p-name').value.trim();
        const category = document.getElementById('p-cat').value;
        const subcategory = document.getElementById('p-subcat').value.trim() || 'General';
        const cost = parseFloat(document.getElementById('p-cost').value) || 0;
        const price = parseFloat(document.getElementById('p-price').value) || 0;
        const stock = type === 'service' ? 0 : parseInt(document.getElementById('p-stock').value) || 0;
        const minStock = type === 'service' ? 0 : parseInt(document.getElementById('p-minstock').value) || 0;
        const brand = document.getElementById('p-brand').value.trim() || 'General';

        if (existingId) {
            const idx = db.inventory.findIndex(i => i.id === existingId);
            if (idx !== -1) {
                db.inventory[idx] = { id, name, category, subcategory, brand, cost, price, stock, minStock, type };
            }
        } else {
            if (db.inventory.some(i => i.id === id)) {
                showToast('El ID de producto ya existe', 'error');
                return;
            }
            db.inventory.push({ id, name, category, subcategory, brand, cost, price, stock, minStock, type });
        }

        saveDB();
        closeModal();
        renderContent();
        showToast('Producto guardado correctamente en la nube');
    }

    function deleteProduct(id) {
        if (confirm('¿Está seguro de eliminar este producto?')) {
            db.inventory = db.inventory.filter(i => i.id !== id);
            saveDB();
            renderContent();
            showToast('Producto eliminado');
        }
    }

    function exportInventoryBackup() {
        const csvRows = [["ID", "Nombre", "Categoría", "Subcategoría", "Costo", "Precio", "Stock"]];
        db.inventory.forEach(i => csvRows.push([i.id, `"${i.name}"`, i.category, i.subcategory, i.cost, i.price, i.stock]));
        const csvContent = "data:text/csv;charset=utf-8," + csvRows.map(e => e.join(",")).join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "inventario_boss_" + new Date().toISOString().split('T')[0] + ".csv");
        document.body.appendChild(link);
        link.click();
        link.remove();
        showToast('Inventario exportado como Excel (CSV)');
    }

    function addToCart(productId) {
        const product = db.inventory.find(i => i.id === productId);
        if (!product) return;

        if (product.type === 'physical' && product.stock <= 0) {
            showToast('Producto agotado', 'error');
            return;
        }

        const existing = db.cart.items.find(i => i.id === productId);
        if (existing) {
            if (product.type === 'physical' && existing.quantity >= product.stock) {
                showToast('Stock insuficiente', 'error');
                return;
            }
            existing.quantity++;
        } else {
            db.cart.items.push({
                id: product.id,
                name: product.name,
                price: product.price,
                cost: product.cost,
                quantity: 1,
                type: product.type
            });
        }
        renderCart();
    }

    function updateCartQuantity(productId, delta) {
        const item = db.cart.items.find(i => i.id === productId);
        if (!item) return;

        if (delta > 0 && item.type === 'physical') {
            const product = db.inventory.find(p => p.id === productId);
            if (item.quantity >= product.stock) {
                showToast('Stock máximo alcanzado', 'error');
                return;
            }
        }

        item.quantity += delta;
        if (item.quantity <= 0) {
            db.cart.items = db.cart.items.filter(i => i.id !== productId);
        }
        renderCart();
    }

    function updateCartDiscount(val) {
        db.cart.discount = parseFloat(val) || 0;
        renderCart();
    }

    function clearCart() {
        db.cart.items = [];
        db.cart.discount = 0;
        renderCart();
    }

    function renderCart() {
        const container = document.getElementById('cart-items-container');
        if (!container) return;

        if (db.cart.items.length === 0) {
            container.innerHTML = `<div class="text-center py-12 text-gray-400 text-sm">El carrito está vacío</div>`;
            document.getElementById('cart-subtotal').innerText = '$0.00';
            document.getElementById('cart-total').innerText = '$0.00';
            return;
        }

        let subtotal = 0;
        container.innerHTML = db.cart.items.map(item => {
            const totalItem = item.price * item.quantity;
            subtotal += totalItem;
            return `
                <div class="pt-3 first:pt-0 flex items-center justify-between">
                    <div class="flex-1 pr-2">
                        <h5 class="font-bold text-gray-900 text-sm leading-tight">${item.name}</h5>
                        <span class="text-xs text-gray-500">${formatMoney(item.price)} c/u</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="updateCartQuantity('${item.id}', -1)" class="w-7 h-7 bg-gray-100 hover:bg-gray-200 rounded-lg font-bold text-gray-700 flex items-center justify-center touch-target">-</button>
                        <span class="font-bold text-sm w-6 text-center">${item.quantity}</span>
                        <button onclick="updateCartQuantity('${item.id}', 1)" class="w-7 h-7 bg-gray-100 hover:bg-gray-200 rounded-lg font-bold text-gray-700 flex items-center justify-center touch-target">+</button>
                    </div>
                </div>
            `;
        }).join('');

        const total = Math.max(0, subtotal - (db.cart.discount || 0));
        document.getElementById('cart-subtotal').innerText = formatMoney(subtotal);
        document.getElementById('cart-total').innerText = formatMoney(total);
    }

    let selectedPaymentMethod = 'Efectivo';
    function setPaymentMethod(method) {
        selectedPaymentMethod = method;
        ['Efectivo', 'Tarjeta', 'Transferencia'].forEach(m => {
            const btn = document.getElementById('pm-' + m);
            if (btn) {
                if (m === method) {
                    btn.className = 'py-2.5 rounded-xl border font-medium text-xs bg-boss-50 border-boss-600 text-boss-700 touch-target';
                } else {
                    btn.className = 'py-2.5 rounded-xl border font-medium text-xs bg-white border-gray-200 text-gray-700 touch-target';
                }
            }
        });
        const cashContainer = document.getElementById('cash-received-container');
        if (cashContainer) cashContainer.style.display = method === 'Efectivo' ? 'block' : 'none';
    }

    function calculateChange(total) {
        const receivedInput = document.getElementById('checkout-received');
        const changeEl = document.getElementById('checkout-change');
        if (!receivedInput || !changeEl) return;
        const received = parseFloat(receivedInput.value) || 0;
        const change = Math.max(0, received - total);
        changeEl.innerText = formatMoney(change);
    }

    function completeSale(total) {
        const clientInput = document.getElementById('checkout-client');
        const clientName = clientInput && clientInput.value.trim() ? clientInput.value.trim() : 'Público General';
        const received = selectedPaymentMethod === 'Efectivo' ? (parseFloat(document.getElementById('checkout-received').value) || 0) : total;

        if (selectedPaymentMethod === 'Efectivo' && received < total) {
            showToast('El dinero recibido es menor al total', 'error');
            return;
        }

        const change = selectedPaymentMethod === 'Efectivo' ? (received - total) : 0;
        const now = new Date();
        const saleId = 'T-' + String(Date.now()).slice(-6);

        db.cart.items.forEach(cartItem => {
            if (cartItem.type === 'physical') {
                const invItem = db.inventory.find(i => i.id === cartItem.id);
                if (invItem) {
                    invItem.stock = Math.max(0, invItem.stock - cartItem.quantity);
                }
            }
        });

        const saleRecord = {
            id: saleId,
            timestamp: now.toISOString(),
            date: now.toISOString().split('T')[0],
            time: now.toLocaleTimeString('es-MX'),
            clientName,
            items: [...db.cart.items],
            subtotal: db.cart.items.reduce((acc, i) => acc + (i.price * i.quantity), 0),
            discount: db.cart.discount,
            total,
            received,
            change,
            paymentMethod: selectedPaymentMethod,
            seller: db.auth.currentUser ? db.auth.currentUser.username : 'Sistema',
            cancelled: false
        };

        db.sales.push(saleRecord);

        db.finances.push({
            id: 'F-' + saleId,
            date: saleRecord.date,
            time: saleRecord.time,
            type: 'venta',
            category: 'Ventas POS',
            concept: `Venta #${saleId}`,
            description: `Cliente: ${clientName}`,
            amount: total,
            method: selectedPaymentMethod,
            refId: saleId
        });

        saveDB();
        clearCart();
        closeModal();
        renderContent();

        openTicketPromptModal(saleRecord);
    }

    // --- FINANCES AND EXPENSES MODULES ---
    function renderFinances(container) {
        const finances = db.finances || [];
        const sales = db.sales || [];

        let totalSalesAmount = 0, totalExpensesAmount = 0, totalIncomeAmount = 0;
        let totalCostOfGoods = 0;

        sales.forEach(s => {
            if (!s.cancelled) {
                totalSalesAmount += s.total;
                s.items.forEach(i => {
                    const inv = db.inventory.find(inv => inv.id === i.id);
                    totalCostOfGoods += (inv ? inv.cost : 0) * i.quantity;
                });
            }
        });

        finances.forEach(f => {
            if (f.type === 'gasto') totalExpensesAmount += f.amount;
            if (f.type === 'ingreso') totalIncomeAmount += f.amount;
        });

        const grossProfit = totalSalesAmount - totalCostOfGoods;

        container.innerHTML = `
            <div class="flex flex-col space-y-6">
                <div class="flex flex-wrap items-center justify-between gap-4">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-900">Gastos e Ingresos</h2>
                        <p class="text-xs text-gray-500">Control financiero sincronizado en la nube</p>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="openExpenseModal()" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2.5 rounded-xl text-sm font-semibold shadow-sm transition flex items-center space-x-2 touch-target">
                            <i class="fa-solid fa-minus"></i>

    function cancelSaleModal(saleId) {
        if (confirm('¿Está seguro de cancelar esta venta? Se devolverán los productos físicos al inventario y se registrará en la nube.')) {
            const sale = db.sales.find(s => s.id === saleId);
            if (sale && !sale.cancelled) {
                sale.cancelled = true;

                sale.items.forEach(item => {
                    if (item.type === 'physical') {
                        const inv = db.inventory.find(i => i.id === item.id);
                        if (inv) inv.stock += item.quantity;
                    }
                });

                db.finances.push({
                    id: 'CANC-' + saleId,
                    date: new Date().toISOString().split('T')[0],
                    time: new Date().toLocaleTimeString('es-MX'),
                    type: 'gasto',
                    category: 'Cancelación / Devolución',
                    concept: `Cancelación Venta #${saleId}`,
                    description: `Reembolso de venta por cancelación`,
                    amount: sale.total,
                    method: sale.paymentMethod,
                    refId: saleId
                });

                saveDB();
                renderContent();
                showToast('Venta cancelada e inventario actualizado en la nube');
            }
        }
    }

    // --- CASH CUT (CORTE DE CAJA) ---
    function openCashCutModal() {
        const todayStr = new Date().toISOString().split('T')[0];
        const sales = db.sales.filter(s => s.date === todayStr && !s.cancelled);

        let totals = {
            dulceria: { total: 0, efectivo: 0, tarjeta: 0, transferencia: 0 },
            snacks: { total: 0, efectivo: 0, tarjeta: 0, transferencia: 0 },
            servicios: { total: 0, efectivo: 0, tarjeta: 0, transferencia: 0 },
            general: { total: 0, efectivo: 0, tarjeta: 0, transferencia: 0 },
            cost: 0
        };

        sales.forEach(s => {
            s.items.forEach(i => {
                const itemTotal = i.price * i.quantity;
                const inv = db.inventory.find(inv => inv.id === i.id);
                const itemCost = (inv ? inv.cost : 0) * i.quantity;
                totals.cost += itemCost;

                let target = totals.snacks;
                if (i.category === 'Dulcería') target = totals.dulceria;
                if (i.category === 'Impresiones y Copias') target = totals.servicios;

                target.total += itemTotal;
                if (s.paymentMethod === 'Efectivo') target.efectivo += itemTotal;
                if (s.paymentMethod === 'Tarjeta') target.tarjeta += itemTotal;
                if (s.paymentMethod === 'Transferencia') target.transferencia += itemTotal;

                totals.general.total += itemTotal;
                if (s.paymentMethod === 'Efectivo') totals.general.efectivo += itemTotal;
                if (s.paymentMethod === 'Tarjeta') totals.general.tarjeta += itemTotal;
                if (s.paymentMethod === 'Transferencia') totals.general.transferencia += itemTotal;
            });
        });

        let expensesToday = 0;
        db.finances.filter(f => f.date === todayStr && f.type === 'gasto').forEach(f => expensesToday += f.amount);

        const grossProfit = totals.general.total - totals.cost;
        const estimatedProfit = grossProfit - expensesToday;

        const html = `
            <div class="space-y-4">
                <h3 class="text-xl font-bold text-gray-900">Corte de Caja Diario</h3>
                <p class="text-xs text-gray-500">Fecha: ${todayStr}</p>
                <div class="space-y-3 text-sm">
                    <div class="bg-gray-50 p-3 rounded-xl border">
                        <span class="font-bold text-gray-800 block mb-1">Dulcería</span>
                        <div class="flex justify-between text-xs text-gray-600"><span>Efectivo: ${formatMoney(totals.dulceria.efectivo)}</span><span>Tarjeta: ${formatMoney(totals.dulceria.tarjeta)}</span><span>Transf: ${formatMoney(totals.dulceria.transferencia)}</span></div>
                        <div class="font-semibold text-right mt-1">Total: ${formatMoney(totals.dulceria.total)}</div>
                    </div>
                    <div class="bg-gray-50 p-3 rounded-xl border">
                        <span class="font-bold text-gray-800 block mb-1">Aguas y Snacks</span>
                        <div class="flex justify-between text-xs text-gray-600"><span>Efectivo: ${formatMoney(totals.snacks.efectivo)}</span><span>Tarjeta: ${formatMoney(totals.snacks.tarjeta)}</span><span>Transf: ${formatMoney(totals.snacks.transferencia)}</span></div>
                        <div class="font-semibold text-right mt-1">Total: ${formatMoney(totals.snacks.total)}</div>
                    </div>
                    <div class="bg-gray-50 p-3 rounded-xl border">
                        <span class="font-bold text-gray-800 block mb-1">Impresiones y Servicios</span>
                        <div class="flex justify-between text-xs text-gray-600"><span>Efectivo: ${formatMoney(totals.servicios.efectivo)}</span><span>Tarjeta: ${formatMoney(totals.servicios.tarjeta)}</span><span>Transf: ${formatMoney(totals.servicios.transferencia)}</span></div>
                        <div class="font-semibold text-right mt-1">Total: ${formatMoney(totals.servicios.total)}</div>
                    </div>
                    <div class="border-t pt-3 space-y-1 font-medium">
                        <div class="flex justify-between"><span>Costo Mercancía:</span><span class="text-amber-600">${formatMoney(totals.cost)}</span></div>
                        <div class="flex justify-between"><span>Utilidad Bruta:</span><span class="text-emerald-600">${formatMoney(grossProfit)}</span></div>
                        <div class="flex justify-between"><span>Gastos del Día:</span><span class="text-rose-600">${formatMoney(expensesToday)}</span></div>
                        <div class="flex justify-between text-base font-bold border-t pt-2"><span>Total General:</span><span class="text-boss-600">${formatMoney(totals.general.total)}</span></div>
                    </div>
                </div>
                <button onclick="printCashCut(${JSON.stringify(totals).replace(/"/g, '&quot;')}, ${expensesToday}, ${grossProfit}, ${estimatedProfit})" class="w-full bg-boss-600 hover:bg-boss-700 text-white font-semibold py-3 rounded-xl transition shadow-md touch-target">
                    Imprimir Corte de Caja
                </button>
            </div>
        `;
        openModal(html);
    }

                        <label class="block text-xs font-semibold text-gray-700 mb-1">Texto Pie de Ticket</label>
                        <input type="text" id="cfg-footer" value="${b.footerText}" class="w-full px-3 py-2 border border-gray-300 rounded-xl text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Texto Extra / Políticas</label>

                    </button>
                </form>
            </div>
        `;

    function saveBusinessConfig(e) {
        e.preventDefault();
        db.business.name = document.getElementById('cfg-name').value.trim();
        db.business.owner = document.getElementById('cfg-owner').value.trim();
        db.business.phone = document.getElementById('cfg-phone').value.trim();
        db.business.address = document.getElementById('cfg-address').value.trim();
        db.business.footerText = document.getElementById('cfg-footer').value.trim();
        db.business.extraText = document.getElementById('cfg-extra').value.trim();
        db.business.logo = document.getElementById('cfg-logo').value.trim();

        saveDB();
        updateHeaderInfo();
        showToast('Configuración guardada y sincronizada en la nube');
    }

    window.onload = function () {
